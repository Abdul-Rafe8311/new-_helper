name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

  api:
    name: API · lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: newshelper
          POSTGRES_PASSWORD: newshelper
          POSTGRES_DB: newshelper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newshelper -d newshelper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://newshelper:newshelper@localhost:5432/newshelper_test
      DATABASE_URL: postgresql+asyncpg://newshelper:newshelper@localhost:5432/newshelper_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag upstream
        with:
          version: "0.13.1"
          python-version: "3.12"
          working-directory: apps/api
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install WeasyPrint system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fonts-dejavu
      - name: Install
        run: uv sync --frozen
      - name: Lockfile in sync
        run: uv lock --check
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app
      - name: Migrations apply to a fresh DB (and round-trip)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Seed works (twice, idempotent)
        run: |
          uv run python -m app.scripts.seed
          uv run python -m app.scripts.seed
      - name: Pytest (with pgvector)
        run: uv run pytest -rs
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  docker:
    name: API · Docker build + smoke test
    needs: [changes, api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          load: true
          push: false
          tags: newshelper-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8000:8000 newshelper-api:ci
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8000/health); then
              echo "$body"
              echo "$body" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .git_sha == $sha'
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Runs as non-root
        run: test "$(docker run --rm newshelper-api:ci id -u)" != "0"

  web:
    name: Web · lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: Web · e2e smoke (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Production build
        run: pnpm build
      - name: Playwright smoke tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, api, docker, web, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
