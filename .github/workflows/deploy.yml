name: Deploy

# Ships main to production once CI is green: GHCR image -> DB migrations -> Render API
# -> Vercel web -> smoke test. Vercel's own Git deploys are switched off (ignored build
# step), so this workflow is the only path to production.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # workflow_run sees the CI-tested commit; a manual run deploys the selected ref.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/newshelper-api

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  image:
    name: API · build and push image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ needs.gate.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: GIT_SHA=${{ needs.gate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - id: ref
        run: echo "ref=${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
        env:
          SHA_TAG: ${{ needs.gate.outputs.sha }}

  api:
    name: API · migrate and deploy to Render
    needs: [gate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag upstream
        with:
          version: "0.13.1"
          python-version: "3.12"
          working-directory: apps/api
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install
        working-directory: apps/api
        run: uv sync --frozen --no-dev
      - name: Run migrations on the production database
        working-directory: apps/api
        env:
          ENV: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head
      - name: Trigger the Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "::error::RENDER_DEPLOY_HOOK_URL is not set"; exit 1; }
          img=$(jq -rn --arg v "$IMAGE_REF" '$v|@uri')
          # -sS without -v so the hook URL (which embeds a key) never reaches the log.
          curl -fsS -o /dev/null --max-time 30 -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${img}"
          echo "Render deploy triggered for $IMAGE_REF"
      - name: Wait for the new version to go live
        env:
          API_URL: ${{ vars.API_URL }}
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          test -n "$API_URL" || { echo "::error::repository variable API_URL is not set"; exit 1; }
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            live=$(curl -fsS --max-time 15 "${API_URL%/}/health" 2>/dev/null | jq -r '.git_sha // empty' || true)
            if [ "$live" = "$EXPECTED_SHA" ]; then
              echo "API is live at $EXPECTED_SHA"
              exit 0
            fi
            echo "live: ${live:-unreachable}, waiting for $EXPECTED_SHA ..."
            sleep 15
          done
          echo "::error::API did not report $EXPECTED_SHA within 10 minutes"
          exit 1

  web:
    name: Web · deploy to Vercel
    needs: [gate, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install Vercel CLI
        run: npm install --global vercel@64.5.0
      - name: Pull project settings
        run: vercel pull --yes --environment=production
      - name: Build
        run: vercel build --prod
      - name: Deploy
        run: vercel deploy --prebuilt --prod

  smoke:
    name: Smoke test
    needs: [gate, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Smoke test web, API and the demo login
        run: .github/scripts/smoke.sh "${{ vars.WEB_URL }}" "${{ vars.API_URL }}" "${{ needs.gate.outputs.sha }}"
