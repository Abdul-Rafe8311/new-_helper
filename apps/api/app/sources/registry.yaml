  # Football
  - {name: BBC Sport Football, kind: rss, url: "https://feeds.bbci.co.uk/sport/football/rss.xml", topics: [football], quality: 0.7}
  - {name: The Guardian Football, kind: rss, url: "https://www.theguardian.com/football/rss", topics: [football], quality: 0.7}
  # Formula 1
  - {name: BBC Sport Formula 1, kind: rss, url: "https://feeds.bbci.co.uk/sport/formula1/rss.xml", topics: [f1], quality: 0.7}
  - {name: Motorsport.com F1, kind: rss, url: "https://www.motorsport.com/rss/f1/news/", topics: [f1]}
  # Other sport
  - {name: BBC Sport, kind: rss, url: "https://feeds.bbci.co.uk/sport/rss.xml", topics: [sports]}
  # Culture
  - {name: The Guardian Culture, kind: rss, url: "https://www.theguardian.com/uk/culture/rss", topics: [film-tv, books, music], quality: 0.7}
  - {name: Pitchfork News, kind: rss, url: "https://pitchfork.com/feed/feed-news/rss", topics: [music]}
  - {name: Variety, kind: rss, url: "https://variety.com/feed/", topics: [film-tv]}
  # Design
  - {name: Dezeen, kind: rss, url: "https://www.dezeen.com/feed/", topics: [design], quality: 0.7}
  # Gaming
  - {name: Polygon, kind: rss, url: "https://www.polygon.com/feed/", topics: [gaming]}
  - {name: Rock Paper Shotgun, kind: rss, url: "https://www.rockpapershotgun.com/feed", topics: [gaming]}

  # Query-driven sources: one row each so articles and failures are attributed
  - {name: Google News, kind: google_news, url: "https://news.google.com/rss/search", topics: [world], quality: 0.6}
  - {name: Hacker News, kind: hackernews, url: "https://hn.algolia.com/api/v1/search", topics: [tech, startups], quality: 0.6}
  - {name: arXiv cs.AI, kind: arxiv, url: "https://export.arxiv.org/api/query?search_query=cat:cs.AI", topics: [ai, science], quality: 0.7}
  - {name: arXiv cs.CL, kind: arxiv, url: "https://export.arxiv.org/api/query?search_query=cat:cs.CL", topics: [ai, science], quality: 0.7}
  - {name: arXiv cs.LG, kind: arxiv, url: "https://export.arxiv.org/api/query?search_query=cat:cs.LG", topics: [ai, science], quality: 0.7}
