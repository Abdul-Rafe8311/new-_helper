name: newshelper

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: newshelper
      POSTGRES_PASSWORD: newshelper
      POSTGRES_DB: newshelper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newshelper -d newshelper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
